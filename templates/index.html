<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Sensor Data with Mapbox</title>
    
    <!-- Include Mapbox GL JS -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet" />
    
    <!-- Include Chart.js & Socket.io -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .chart-container {
            width: 90%;
            max-width: 800px; /* Keep charts properly sized */
            margin: auto;
            padding: 10px;
        }
        canvas {
            width: 100% !important; 
            height: 250px !important; /* Reduce height while keeping proportions */
        }
        #map {
            width: 100%;
            height: 200px;
            margin-top: 20px;
            border-radius: 10px;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <h2>Live Sensor Data</h2>

    <div class="chart-container">
        <h3>Accelerometer</h3>
        <canvas id="accelChart"></canvas>
    </div>

    <div class="chart-container">
        <h3>Gyroscope</h3>
        <canvas id="gyroChart"></canvas>
    </div>

    <h3>Live Location (Mapbox)</h3>
    <div id="map"></div>

    <script>
        // Replace with your Mapbox Access Token
        mapboxgl.accessToken = "pk.eyJ1IjoiYmliZWtyYW5qaXQiLCJhIjoiY203MWhldDFoMGRuajJsb3Qxd3Jmemw0cSJ9.fmzlqQW1v9cdT_tbe1LK3Q";
        
        // mapboxgl.accessToken = "YOUR_MAPBOX_ACCESS_TOKEN";

        // Set default location: Toronto, Canada
        const defaultLocation = [-79.3832, 43.6532]; // Toronto (longitude, latitude)

        // Initialize Mapbox map with 2D top-down view
        const map = new mapboxgl.Map({
            container: "map", // ID of the div where map will be displayed
            style: "mapbox://styles/mapbox/streets-v11", // Standard 2D view
            center: defaultLocation, // Start in Toronto
            zoom: 12, // Default zoom level
            pitch: 0, // Ensure 2D view (no tilt)
            bearing: 0 // Ensure standard top-down angle
        });

        // Disable scroll zoom initially but allow manual zooming
        map.scrollZoom.disable();
        map.addControl(new mapboxgl.NavigationControl());

        // Add a pulsing red marker at the default location
        const marker = new mapboxgl.Marker({ color: "red", draggable: false })
            .setLngLat(defaultLocation)
            .addTo(map);

        console.log(defaultLocation)

        let userMovedMap = false; // Track if user manually moves the map
        map.on("move", () => {
            userMovedMap = true;
        });


        // Connect to Flask WebSocket
        const socket = io.connect("http://localhost:5000");

        socket.on("sensor_data", function (data) {
            console.log(data);
            
            // Update accelerometer chart
            accelChart.data.labels.push(new Date().toLocaleTimeString());
            accelChart.data.datasets[0].data.push(data.acceleration.x);
            accelChart.data.datasets[1].data.push(data.acceleration.y);
            accelChart.data.datasets[2].data.push(data.acceleration.z);
            if (accelChart.data.labels.length > 20) {
                accelChart.data.labels.shift();
                accelChart.data.datasets.forEach(dataset => dataset.data.shift());
            }
            accelChart.update();

            // Update gyroscope chart
            gyroChart.data.labels.push(new Date().toLocaleTimeString());
            gyroChart.data.datasets[0].data.push(data.gyroscope.x);
            gyroChart.data.datasets[1].data.push(data.gyroscope.y);
            gyroChart.data.datasets[2].data.push(data.gyroscope.z);
            if (gyroChart.data.labels.length > 20) {
                gyroChart.data.labels.shift();
                gyroChart.data.datasets.forEach(dataset => dataset.data.shift());
            }
            gyroChart.update();

            // Update map location only if valid coordinates are received
            if (data.location.lat && data.location.lon) {
                const newPosition = [parseFloat(data.location.lon), parseFloat(data.location.lat)];

                // Update marker position
                marker.setLngLat(newPosition);

                // Recenter the map only if the user has not moved it manually
                if (!userMovedMap) {
                    map.jumpTo({ center: newPosition, zoom: 14 });
                }
            }
        });

        // Initialize Charts
        const ctx1 = document.getElementById('accelChart').getContext('2d');
        const accelChart = new Chart(ctx1, {
            type: 'line',
            data: { labels: [], datasets: [
                { label: 'AccX', data: [], borderColor: 'red', fill: false },
                { label: 'AccY', data: [], borderColor: 'green', fill: false },
                { label: 'AccZ', data: [], borderColor: 'blue', fill: false }
            ] },
            options: { 
                responsive: true, 
                maintainAspectRatio: false, 
                scales: { y: { beginAtZero: true } } 
            }
        });

        const ctx2 = document.getElementById('gyroChart').getContext('2d');
        const gyroChart = new Chart(ctx2, {
            type: 'line',
            data: { labels: [], datasets: [
                { label: 'GyroX', data: [], borderColor: 'purple', fill: false },
                { label: 'GyroY', data: [], borderColor: 'orange', fill: false },
                { label: 'GyroZ', data: [], borderColor: 'pink', fill: false }
            ] },
            options: { 
                responsive: true, 
                maintainAspectRatio: false, 
                scales: { y: { beginAtZero: true } } 
            }
        });
    </script>
</body>
</html>
